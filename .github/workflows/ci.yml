name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore Bitrix24LeadConnector.sln
      - run: dotnet build Bitrix24LeadConnector.sln -c Release --no-restore
      - run: dotnet test Bitrix24LeadConnector.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: node --test tests/frontend.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
